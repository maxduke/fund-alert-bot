services:
  fund-alert-bot:
    image: "ghcr.io/maxduke/fund-alert-bot:${BOT_IMAGE_TAG:?Set BOT_IMAGE_TAG=sha-<commit> in .env}"
    restart: unless-stopped
    user: "${BOT_UID:?Set BOT_UID in .env}:${BOT_GID:?Set BOT_GID in .env}"
    env_file: .env
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
