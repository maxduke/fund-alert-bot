services:
  fund-alert-bot:
    image: "ghcr.io/maxduke/fund-alert-bot:${BOT_IMAGE_TAG:?Set BOT_IMAGE_TAG=sha-<commit> in .env}"
    restart: unless-stopped
    user: "${BOT_UID:?Set BOT_UID in .env}:${BOT_GID:?Set BOT_GID in .env}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    environment:
      SQLITE_PATH: /app/data/fund_alert_bot.sqlite3
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
